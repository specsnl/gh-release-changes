version: "2"
linters:
  default: standard
  enable:
    - wsl_v5
    - whitespace
    - modernize
  settings:
    errcheck:
      # Diagnostics on stderr are best-effort: output.Writer has no error channel
      # and reporting a write failure would itself need a working stream. See
      # internal/util/output/writer.go.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
