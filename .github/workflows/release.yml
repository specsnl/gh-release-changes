name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go/pkg/mod
            ~/.cache/go/build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A final tagged on the commit of its last RC carries both tags, and
          # goreleaser would otherwise pick the RC; release the tag that was pushed.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # GITHUB_TOKEN is scoped to this repo; writing the casks to
          # specsnl/homebrew-tap needs the organisation secret.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
