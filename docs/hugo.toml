baseURL = "https://gh-release-changes.specs.dev/"
locale = "en-us"
title = "gh release-changes"

enableRobotsTXT = true
enableGitInfo = true
cleanDestinationDir = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "A gh extension that sorts and extracts the changes of a GitHub release for its different audiences."

  [params.navbar]
    logo.path = "logo.svg"
    logo.dark = "logo.svg"
    logo.width = 28
    logo.height = 28

  [params.mermaid]
    enable = true

  [params.footer]
    displayPoweredBy = false
    displayCopyright = true

[[menu.main]]
  identifier = "docs"
  name = "Docs"
  pageRef = "/docs"
  weight = 1

[[menu.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/specsnl/gh-release-changes"
  weight = 2
  params = { type = "icon", icon = "github" }
